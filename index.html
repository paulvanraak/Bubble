<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Bubble Wrap Pop</title>
  <meta name="description" content="An infinite, gorgeously low-poly sheet of bubble wrap that never runs out." />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header id="hud">
      <div id="points-wrap">
        <div id="points-display">0 💧</div>
      </div>
      <div id="combo-bar-wrap">
        <div id="combo-bar"></div>
        <span id="combo-label"></span>
      </div>
      <div id="hud-right">
        <div id="streak-badge" title="Daily streak">🔥 <span id="streak-count">0</span></div>
        <button id="mute-btn" title="Mute/unmute">🔊</button>
      </div>
    </header>

    <div id="toast-container"></div>

    <div id="hint">Click or tap the bubbles to pop them!</div>

    <nav id="bottom-nav">
      <button data-panel="shop">🛒<span>Shop</span></button>
      <button data-panel="achievements">🏆<span>Achievements</span></button>
      <button data-panel="cosmetics">🎨<span>Skins</span></button>
      <button id="prestige-btn" class="hidden" data-panel="prestige">♻️<span>Recycle</span></button>
    </nav>

    <div id="panel-overlay" class="hidden">
      <div id="panel">
        <div id="panel-header">
          <h2 id="panel-title">Panel</h2>
          <button id="panel-close" aria-label="Close">✕</button>
        </div>
        <div id="panel-content"></div>
      </div>
    </div>

    <div id="modal-overlay" class="hidden">
      <div id="modal"></div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
